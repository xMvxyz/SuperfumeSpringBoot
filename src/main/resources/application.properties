spring.application.name=Superfume

# === Conexión a Supabase / PostgreSQL ===
# Recomendado: establecer las variables de entorno `SPRING_DATASOURCE_URL`,
# `SPRING_DATASOURCE_USERNAME` y `SPRING_DATASOURCE_PASSWORD`.
# Ejemplo de URL JDBC (sustituye con valores de tu proyecto Supabase):
# jdbc:postgresql://db.xxx.supabase.co:5432/postgres?sslmode=require

# 1. La URL (Agrega 'jdbc:' al principio y ?sslmode=require al final)
spring.datasource.url=jdbc:postgresql://db.mseuhoqwkeqlniuyfpsr.supabase.co:5432/postgres?sslmode=require

# 2. El Usuario (La parte entre // y :)
spring.datasource.username=postgres

# 3. La Contraseña (La parte entre : y @)
spring.datasource.password=${DB_PASSWORD}

# Driver obligatorio
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Desactivar Flyway por ahora
spring.flyway.enabled=false

# Configuración del servidor
server.port=8080


