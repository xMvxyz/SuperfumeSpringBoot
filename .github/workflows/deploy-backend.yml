name: Deploy a EC2


on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar con Maven
        run: mvn clean package -DskipTests

      - name: Copiar JAR a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          source: "target/Superfume-0.0.1-SNAPSHOT.jar"
          target: "/home/ec2-user/app/"   #SIEMPRE carpeta
          use_insecure_cipher: true

      - name: Crear servicio systemd (primera vez)
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          use_insecure_cipher: true
          script: |
            sudo tee /etc/systemd/system/superfume-backend.service > /dev/null <<EOF
            [Unit]
            Description=Superfume Backend Service
            After=network.target

            [Service]
            Type=simple
            User=ec2-user
            WorkingDirectory=/home/ec2-user/app
            ExecStart=/usr/bin/java -jar /home/ec2-user/app/Superfume-backend.jar
            Restart=always
            RestartSec=10
            StandardOutput=append:/home/ec2-user/app/app.log
            StandardError=append:/home/ec2-user/app/app.log

            [Install]
            WantedBy=multi-user.target
            EOF
            
            sudo systemctl daemon-reload
            sudo systemctl enable superfume-backend.service

      - name: Desplegar e iniciar backend en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          use_insecure_cipher: true
          script: |
            echo "Preparando carpeta"
            mkdir -p /home/ec2-user/app
            
            echo "Moviendo JAR"
            mv /home/ec2-user/app/target/Superfume-0.0.1-SNAPSHOT.jar /home/ec2-user/app/Superfume-backend.jar
            rm -rf /home/ec2-user/app/target
            
            echo "Reiniciando servicio"
            sudo systemctl restart superfume-backend.service
            
            sleep 5
            
            echo "Verificando estado"
            if sudo systemctl is-active --quiet superfume-backend.service; then
              echo "Backend desplegado correctamente"
              sudo systemctl status superfume-backend.service --no-pager
            else
              echo "Error al iniciar el servicio"
              sudo systemctl status superfume-backend.service --no-pager
              tail -n 50 /home/ec2-user/app/app.log
              exit 1
            fi
