name: Deploy a EC2


on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar con Maven
        run: mvn clean package -DskipTests

      - name: Copiar JAR a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          source: "target/Superfume-0.0.1-SNAPSHOT.jar"
          target: "/home/ec2-user/app/"   #SIEMPRE carpeta
          use_insecure_cipher: true

      - name: Desplegar e iniciar backend en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          use_insecure_cipher: true
          script_stop: true
          script: |
            echo "Limpiando procesos anteriores"
            pkill -f "Superfume-backend.jar" || true
            sleep 2

            echo "Asegurando carpeta"
            mkdir -p /home/ec2-user/app

            echo "Renombrando JAR"
            mv /home/ec2-user/app/Superfume-0.0.1-SNAPSHOT.jar /home/ec2-user/app/Superfume-backend.jar

            echo "Iniciando backend"
            cd /home/ec2-user/app
            nohup java -jar Superfume-backend.jar > app.log 2>&1 </dev/null &
            BACKEND_PID=$!
            
            sleep 5

            echo "Verificando ejecución"
            if pgrep -f "Superfume-backend.jar" > /dev/null; then
              echo "Backend desplegado y ejecutándose correctamente (PID: $BACKEND_PID)"
              exit 0
            else
              echo "Error: El backend no pudo iniciarse"
              tail -n 50 app.log
              exit 1
            fi
