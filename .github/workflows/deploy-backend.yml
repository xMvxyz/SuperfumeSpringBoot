name: Deploy a EC2


on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio Backend
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Descargar repositorio Frontend
        uses: actions/checkout@v4 
        with:
          repository: xMvxyz/SuperfumeReact
          ref: main
          path: frontend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/react-app/package-lock.json

      - name: Compilar Frontend
        working-directory: ./frontend/react-app
        run: |
          echo "Instalando dependencias del frontend..."
          npm ci
          echo "Compilando frontend para producción..."
          npm run build
          echo "Frontend compilado exitosamente"
          ls -la dist/

      - name: Copiar Frontend a recursos estáticos del Backend
        run: |
          echo "Copiando frontend al backend..."
          mkdir -p backend/src/main/resources/static
          cp -r frontend/react-app/dist/* backend/src/main/resources/static/
          echo "Archivos copiados exitosamente"
          ls -la backend/src/main/resources/static/

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar Backend con Frontend embebido
        working-directory: ./backend
        run: |
          mvn clean package -DskipTests
          mv target/Superfume-0.0.1-SNAPSHOT.jar target/Superfume-deploy.jar

      - name: Copiar JAR a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          source: "backend/target/Superfume-deploy.jar"
          target: "/home/ec2-user/app/"   #SIEMPRE carpeta
          use_insecure_cipher: true

      - name: Crear servicio systemd (primera vez)
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          use_insecure_cipher: true
          script: |
            sudo tee /etc/systemd/system/superfume-backend.service > /dev/null <<EOF
            [Unit]
            Description=Superfume Backend Service
            After=network.target

            [Service]
            Type=simple
            User=ec2-user
            WorkingDirectory=/home/ec2-user/app
            Environment="DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
            Environment="JWT_SECRET=${{ secrets.JWT_SECRET }}"
            ExecStart=/usr/bin/java -jar /home/ec2-user/app/Superfume-deploy.jar
            Restart=always
            RestartSec=10
            StandardOutput=append:/home/ec2-user/app/app.log
            StandardError=append:/home/ec2-user/app/app.log

            [Install]
            WantedBy=multi-user.target
            EOF
            
            sudo systemctl daemon-reload
            sudo systemctl enable superfume-backend.service

      - name: Desplegar e iniciar backend en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          use_insecure_cipher: true
          script: |
            echo "Preparando carpeta"
            mkdir -p /home/ec2-user/app
            
            echo "Moviendo JAR con frontend embebido"
            mv /home/ec2-user/app/backend/target/Superfume-deploy.jar /home/ec2-user/app/Superfume-deploy.jar
            rm -rf /home/ec2-user/app/backend
            
            echo "Reiniciando servicio"
            sudo systemctl restart superfume-backend.service
            
            sleep 5
            
            echo "Verificando estado"
            if sudo systemctl is-active --quiet superfume-backend.service; then
              echo "Backend desplegado correctamente"
              sudo systemctl status superfume-backend.service --no-pager
            else
              echo "Error al iniciar el servicio"
              sudo systemctl status superfume-backend.service --no-pager
              tail -n 50 /home/ec2-user/app/app.log
              exit 1
            fi
